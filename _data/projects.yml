- title: VANISHING LIFE 2026
  start: 2026-04-17
  group: research
  period: 2026
  status: completed
  kind: International
  partners: Academy of Media Arts Cologne (KHM, Germany), Anant National University (India), Central Academy of Fine Arts (China), Chung-Ang University (Korea), Jagannath University (Bangladesh), Vilnius Academy of Arts (Lithuania), University of Beira Interior (Portugal)
  people: "Team Dadaism: Soeun Kim, Yuju Min, Sofiya, Yejin Son, Cheolhun Jang"
  description: International collaborative animation seminar in which student teams from seven art schools each produced a chapter of one omnibus film, working to another team's soundtrack. The Chung-Ang University team was led by Professor Hee Seon Kim.

