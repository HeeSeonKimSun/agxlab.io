- title: "Don't Panic!"
  start: 2023-11-29
  group: research
  period: 2023
  status: completed
  kind: Projection mapping exhibition
  partners: Art Center Gallery 301, Chung-Ang University Seoul Campus
  url: https://ga.cau.ac.kr/news/-dont-panic
  people: Kyungjin Kim, Chae Rin Kim, Hyeonjeong Park, Woomi So, Bomin Seo, Xuanyu Liu, Maksim Tsoy, Rira Choi
  description: A projection mapping project by first and third year students of the Game Contents and Animation programme. Taking its cue from cartoons in which a character falls into a computer and finds a world made of ones and zeros, the piece turned the gallery into a cyber space that visitors walk into, with a few surprises along the way.
