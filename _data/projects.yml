- title: Erasmus+ 2026, Re-Animation Programme
  start: 2026-09-12
  group: research
  period: 2026
  status: upcoming
  kind: International
  partners: Vilnius Academy of Arts (host, Lithuania), Vilnius Tech (Lithuania), Academy of Media Arts Cologne (Germany), University of Greifswald (Germany), ESAD Amiens (France), Anant National University (India), Chung-Ang University (Korea)
  people: Hee Seon Kim
  description: Selected for Erasmus+ 2026. The lab takes part in the programme and presents Chung-Ang University's game and animation programme.

- title: Backpack
